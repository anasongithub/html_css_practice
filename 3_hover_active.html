<!DOCTYPE html>
<html>

<head>
    <style>
        .product-type {
            font-weight: bold;
            font-size: 25px;
        }

        .product-price {
            color: rgb(0, 118, 0);
            font-weight: bold;
        }

        .add-to-cart {
            background-color: rgb(255, 216, 20);
            border: none;
            width: 120px;
            height: 25px;
            border-radius: 13px;
            margin-right: 5px;
            transition: background-color 0.15s;
        }

        .add-to-cart:hover {
            background-color: rgb(211, 178, 17);
        }

        .add-to-cart:active {
            opacity: 0.7;
        }

        .buy-now {
            background-color: rgb(255, 164, 28);
            border: none;
            width: 120px;
            height: 25px;
            border-radius: 13px;
            transition: background-color 0.15s;
        }

        .buy-now:hover {
            background-color: rgb(210, 134, 21);
        }

        .buy-now:active {
            opacity: 0.7;
        }
    </style>
</head>

<body>
    <a href="https://www.amazon.com/" class="link-to-amazon">
        Back to Amazon</a>
    <p class="product-type">Nike Black running shoes</p>
    <p class="product-price">$39 - in stock.</p>
    <p class="delivery-time">Free Delivery Tomorrow</p>
    <button class="add-to-cart">Add to cart</button>
    <button class="buy-now">Buy Now</button>
</body>

</html>
