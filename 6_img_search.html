<!DOCTYPE html>
<html>

<head>
    <title>img & search bar practice</title>
    <style>
        .profile-pic {
            width: 35px;
            height: 35px;
            object-fit: cover;
            object-position: left;
            border-radius: 17px;
            vertical-align: middle;
            margin-right: 8px;

        }

        .desc {
            border: none;
            color: grey;
            vertical-align: middle;

        }

        .tweet {
            border: none;
            font-size: 12px;
            border-radius: 10px;
            font-weight: bold;
            color: white;
            padding-left: 8px;
            padding-right: 8px;
            background-color: rgb(81, 139, 239);
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <img class="profile-pic" src="thumbnail-1.webp">
    <input class="desc" placeholder="What's happening?">
    <button class="tweet">Tweet</button>
</body>

</html>
