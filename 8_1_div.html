<!DOCTYPE html>
<html>

<head>
    <title>img & search bar practice</title>
    <style>
        .profile-pic {
            width: 35px;
            height: 35px;
            object-fit: cover;
            object-position: left;
            border-radius: 17px;
            vertical-align: middle;
            margin-right: 8px;

        }

        .desc {
            border: none;
            width: 200px;
            color: grey;
            vertical-align: middle;

        }

        .tweet {
            border: none;
            font-size: 12px;
            border-radius: 10px;
            font-weight: bold;
            color: white;
            padding-left: 8px;
            padding-right: 8px;
            background-color: rgb(81, 139, 239);
            vertical-align: middle;
        }

        .tweet-div {
            border-radius: 10px;
            padding: 10px;
            width: 329px;
            height: 35px;
            border: none;
            box-shadow: 0px 0px 10px rgb(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <div class="tweet-div">
        <img class="profile-pic" src="thumbnail-1.webp">
        <input class="desc" placeholder="What's happening?">
        <button class="tweet">Tweet</button>
    </div>

</body>

</html>
