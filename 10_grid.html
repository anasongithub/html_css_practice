<!DOCTYPE html>
<html>

<head>
    <title>Add Friend-Div</title>
    <style>
        .suggestions-grid {
            display: grid;
            grid-template-columns: 150px 150px 150px;
            column-gap: 20px;
        }

        .profile-picture {
            width: 100%;
        }

        .profile-pic {
            width: 100%;
            height: 150px;
            object-fit: cover;
            object-position: left;
        }

        .name {
            font-size: 15px;
            font-weight: bold;
            margin-top: 4px;
            margin-left: 5px;
            margin-bottom: 4px;
        }

        .add-friend {
            margin-top: 4px;
            margin-left: 5px;
            margin-bottom: 4px;
            border: none;
            color: white;
            padding: 5px;
            font-size: 10px;
            border-radius: 2px;
            background-color: rgb(17, 92, 255);
        }

        .mutuals {
            font-size: 10px;

        }

        .mutual-container {
            display: grid;
            grid-template-columns: 25px 1fr;
            align-items: center;
            column-gap: 5px;
        }

        .mutual-div {
            margin-right: 4px;
            width: 20px;
        }

        .mutual-picture {
            width: 22px;
            height: 22px;
            border-radius: 10px;
            object-fit: cover;
            object-position: right;
            margin-left: 5px;

        }

        .info {
            display: grid;
            grid-template-columns: 1fr;
            row-gap: 2px;
            align-items: center;

        }

        .friend-suggestion {
            box-shadow: 0px 0px 10px rgb(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <div class="suggestions-grid">
        <div class="friend-suggestion">
            <div class="profile-picture">
                <img class="profile-pic" src="thumbnail-1.webp">
            </div>
            <div class="info">
                <div>
                    <p class="name">Oliver</p>

                </div>
                <div class="mutual-container">
                    <div class="mutual-div">
                        <img class="mutual-picture" src="thumbnail-1.webp">

                    </div>
                    <div class="no-of-mutuals">
                        <p class="mutuals"> 2 mutuals</p>

                    </div>

                </div>
                <div>
                    <button class="add-friend">Add Friend</button>

                </div>
            </div>
        </div>
        <div class="friend-suggestion">
            <div class="profile-picture">
                <img class="profile-pic" src="thumbnail-9.webp">
            </div>
            <div class="info">
                <div>
                    <p class="name">Oliver</p>

                </div>
                <div class="mutual-container">
                    <div class="mutual-div">
                        <img class="mutual-picture" src="thumbnail-9.webp">

                    </div>
                    <div class="no-of-mutuals">
                        <p class="mutuals"> 2 mutuals</p>

                    </div>

                </div>
                <div>
                    <button class="add-friend">Add Friend</button>

                </div>
            </div>
        </div>

        <div class="friend-suggestion">
            <div class="profile-picture">
                <img class="profile-pic" src="thumbnail-8.webp">
            </div>
            <div class="info">
                <div>
                    <p class="name">Oliver</p>

                </div>
                <div class="mutual-container">
                    <div class="mutual-div">
                        <img class="mutual-picture" src="thumbnail-9.webp">

                    </div>
                    <div class="no-of-mutuals">
                        <p class="mutuals"> 2 mutuals</p>

                    </div>

                </div>
                <div>
                    <button class="add-friend">Add Friend</button>

                </div>
            </div>
        </div>
    </div>
</body>

</html>
