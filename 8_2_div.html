<!DOCTYPE html>
<html>

<head>
    <title>Add Friend-Div</title>
    <style>
        .profile-pic {
            width: 150px;
            height: 150px;
            object-fit: cover;
            object-position: left;
        }

        .name {
            font-size: 15px;
            font-weight: bold;
            margin-top: 4px;
            margin-left: 5px;
            margin-bottom: 4px;
        }

        .add-friend {
            margin-top: 4px;
            margin-left: 5px;
            margin-bottom: 4px;
            border: none;
            color: white;
            padding: 5px;
            font-size: 10px;
            border-radius: 2px;
            background-color: rgb(17, 92, 255);
        }

        .mutuals {
            display: block;
            font-size: 10px;
            margin-top: 4px;
            margin-left: 5px;
            margin-bottom: 4px;
        }

        .friend-suggestion {
            vertical-align: top;
            display: inline-block;
            margin-right: 15px;
            width: 150px;
            height: 225px;
            box-shadow: 0px 0px 10px rgb(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>
    <div class="friend-suggestion">
        <img class="profile-pic" src="thumbnail-1.webp">
        <p class="name">Oliver</p>
        <p class="mutuals"> 2 mutuals</p>
        <button class="add-friend">Add Friend</button>
    </div>
    <div class="friend-suggestion">
        <img class="profile-pic" src="thumbnail-9.webp">
        <p class="name">James</p>
        <p class="mutuals">No mutuals</p>

        <button class="add-friend">Add Friend</button>
    </div>
    <div class="friend-suggestion">
        <img class="profile-pic" src="thumbnail-8.webp">
        <p class="name">Felix </p>
        <p class="mutuals"> 3 mutuals</p>
        <button class="add-friend">Add Friend</button>
    </div>
</body>

</html>
