<!DOCTYPE html>
<html>

<head>
    <title>FlexBox</title>
    <style>
        .flexbox {
            display: flex;
            flex-direction: column;
            width: 250px;
            justify-content: space-between;
            padding: 10px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }


        .details {
            padding: 2px;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
        }
    </style>
</head>

<body>
    <div class="flexbox">
        <div class="details">
            <div class="not-type">
                messages
            </div>
            <div class="amount">12</div>
        </div>
        <div class="details">
            <div class="not-type">
                Missed Calls
            </div>
            <div class="amount">3</div>
        </div>
        <div class="details">
            <div class="not-type">
                FaceBook
            </div>
            <div class="amount">20</div>
        </div>
        <div class="details">
            <div class="not-type">
                Instagram
            </div>
            <div class="amount">25</div>
        </div>




    </div>


</body>

</html>
