<!DOCTYPE html>
<html>

<head>
    <style>
        p {
            font-family: arial;
            margin-bottom: 0px;
            margin-top: 0px;
        }

        .product-type {
            font-weight: bold;
            font-size: 30px;
            margin-top: 10px;
            margin-bottom: 10px;
        }

        .product-price {
            color: rgb(0, 118, 0);
            font-weight: bold;
            margin-bottom: 10px;
        }

        .add-to-cart {
            background-color: rgb(255, 216, 20);
            border: none;
            width: 120px;
            height: 25px;
            border-radius: 13px;
            margin-right: 5px;
            transition: background-color 0.15s;
            margin-top: 10px;

        }

        .add-to-cart:hover {
            background-color: rgb(211, 178, 17);
        }

        .add-to-cart:active {
            opacity: 0.7;
        }

        .buy-now {
            background-color: rgb(255, 164, 28);
            border: none;
            width: 120px;
            height: 25px;
            border-radius: 13px;
            transition: background-color 0.15s;
        }

        .buy-now:hover {
            background-color: rgb(210, 134, 21);
        }

        .buy-now:active {
            opacity: 0.7;
        }

        .navigate_button {
            border: 1px;
            border-color: black;
            border-style: solid;
            background-color: white;
            padding-top: 5px;
            padding-bottom: 5px;
            margin-bottom: 10px;

        }

        .delivery-time {
            text-decoration: underline;
        }

        a:link,
        a:visited {
            margin: 5px;
            color: black;
        }

        a:hover {
            color: red;
        }

        a:active {
            color: blue;
        }

        .cool-click {
            background-color: rgb(31, 151, 31);
            font-size: 30px;
            border: none;
            color: white;
            box-shadow: 3px 3px rgba(0, 0, 0, 0.3);
            transition: box-shodow 0.15s,
                margin-left 0.15s, margin-top 0.15s;
        }

        .cool-click:active {
            margin-left: 2px;
            margin-top: 2px;
            box-shadow: 0px 0px rgba(0, 0, 0, 0.15);

        }
    </style>
</head>

<body>
    <a href="https://www.amazon.com/" class="link-to-amazon"></a>
    Back to Amazon</a>
    <p class="product-type">Nike Black running shoes</p>
    <p class="product-price">$39 - in stock.</p>
    <p class="delivery-time">Free Delivery Tomorrow</p>
    <button class="add-to-cart">Add to cart</button>
    <button class="buy-now">Buy Now</button>
    <br><br>
    <button class="navigate_button">Back</button>
    <a href="">1</a>
    <a href="">2</a>
    <a href="">3</a>
    <a href="">4</a>
    <a href="">5</a>
    <button class="navigate_button">Next</button>
    <br>
    <button class="cool-click">Shadow</button>
</body>

</html>
