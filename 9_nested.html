<!DOCTYPE html>
<html>

<head>
    <title>Add Friend-Div</title>
    <style>
        .profile-pic {
            width: 150px;
            height: 150px;
            object-fit: cover;
            object-position: left;
        }

        .name {
            font-size: 15px;
            font-weight: bold;
            margin-top: 4px;
            margin-left: 5px;
            margin-bottom: 4px;
        }

        .add-friend {
            margin-top: 4px;
            margin-left: 5px;
            margin-bottom: 4px;
            border: none;
            color: white;
            padding: 5px;
            font-size: 10px;
            border-radius: 2px;
            background-color: rgb(17, 92, 255);
        }

        .mutuals {
            display: block;
            font-size: 10px;
            margin-top: 4px;
            margin-left: 5px;
            margin-bottom: 4px;

        }

        .no-of-mutuals {
            display: inline-block;
            vertical-align: top;
        }

        .mutual-div {
            margin-right: 4px;
            width: 20px;
            vertical-align: middle;
            display: inline-block;
        }

        .mutual-picture {
            width: 22px;
            height: 22px;
            border-radius: 10px;
            object-fit: cover;
            object-position: right;
            margin-left: 5px;

        }

        .friend-suggestion {
            vertical-align: top;
            display: inline-block;
            margin-right: 15px;
            margin-bottom: 10px;
            width: 150px;
            height: 240px;
            box-shadow: 0px 0px 10px rgb(0, 0, 0, 0.3);
        }
    </style>
</head>

<body>

    <div class="friend-suggestion">
        <div class="profile-picture">
            <img class="profile-pic" src="thumbnail-1.webp">
        </div>
        <div class="info">
            <div>
                <p class="name">Oliver</p>

            </div>
            <div class="mutual-container">
                <div class="mutual-div">
                    <img class="mutual-picture" src="thumbnail-1.webp">

                </div>
                <div class="no-of-mutuals">
                    <p class="mutuals"> 2 mutuals</p>

                </div>

            </div>
            <div>
                <button class="add-friend">Add Friend</button>

            </div>
        </div>
    </div>
    <div class="friend-suggestion">
        <div class="profile-picture">
            <img class="profile-pic" src="thumbnail-9.webp">
        </div>
        <div class="info">
            <div>
                <p class="name">Oliver</p>

            </div>
            <div class="mutual-container">
                <div class="mutual-div">
                    <img class="mutual-picture" src="thumbnail-9.webp">

                </div>
                <div class="no-of-mutuals">
                    <p class="mutuals"> 2 mutuals</p>

                </div>

            </div>
            <div>
                <button class="add-friend">Add Friend</button>

            </div>
        </div>
    </div>

    <div class="friend-suggestion">
        <div class="profile-picture">
            <img class="profile-pic" src="thumbnail-8.webp">
        </div>
        <div class="info">
            <div>
                <p class="name">Oliver</p>

            </div>
            <div class="mutual-container">
                <div class="mutual-div">
                    <img class="mutual-picture" src="thumbnail-9.webp">

                </div>
                <div class="no-of-mutuals">
                    <p class="mutuals"> 2 mutuals</p>

                </div>

            </div>
            <div>
                <button class="add-friend">Add Friend</button>

            </div>
        </div>
    </div>


</body>

</html>
