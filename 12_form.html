<!DOCTYPE html>
<html>

<head>
    <titLe>forms in html</titLe>
    <style>
        body {
            margin: 0;
            background-color: black;
            padding: 0;
        }

        .container {
            width: 300px;
            position: relative;
            height: 270px;
        }

        .form-html {
            background-color: rgb(213, 213, 209);
            border: 1px solid grey;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 100px rgb(0, 0, 0);
            transition: box-shadow 0.5s;
        }

        .form-html:hover {
            box-shadow: inset 0 0 10px black;
        }
    </style>
</head>

<body>
    <div class="container">
        <div action="form.pdf" class="form-html">
            First Name: <input type="text">
            Last Name: <input type="text">
            Email: <input type="email">
            Age: <input type="number">
            DOB: <input type="date">
            <div class="gender">
                Gender: Male <input type="radio" name="Gender"> Female: <input type="radio" name="Gender">
            </div>

            <details>
                <summary>hello</summary>
                Bio: <textarea>hello</textarea>
            </details>
            <input type="submit">
        </div>
    </div>
</body>

</html>
