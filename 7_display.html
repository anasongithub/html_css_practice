<!DOCTYPE html>
<html>

<head>
    <title>sign up</title>
    <style>
        .Fname,
        .Lname {
            display: inline-block;
            font-size: 10px;
            border-color: rgb(147, 144, 144);
            border-style: solid;
            border-width: 1px;
            border-radius: 4px;
            width: 100px;
            margin-bottom: 8px;
            padding: 8px;
        }

        .email {
            display: block;
            font-size: 10px;
            border-color: rgb(147, 144, 144);
            border-style: solid;
            border-width: 1px;
            border-radius: 4px;
            width: 222px;
            margin-bottom: 8px;
            padding: 8px;
        }

        .signup-button {
            padding: 8px;
            width: 240px;
            font-weight: bold;
            border-radius: 5px;
            border: none;
            background-color: rgb(48, 139, 230);
            color: white;
        }
    </style>
</head>

<body>
    <input class="Fname" type="text" placeholder="First Name">
    <input class="Lname" type="text" placeholder="Last Name">
    <input class="email" type="text" placeholder="Email">
    <button class="signup-button">Sign Up</button>
</body>

</html>
